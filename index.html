<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M VÔLEI PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
overflow-x:hidden;
text-align:center;
}

/* laterais */

.lateral{
position:fixed;
top:0;
height:100%;
width:320px;
object-fit:cover;
opacity:0.95;
pointer-events:none;
z-index:0;
}

.left{left:0;}
.right{right:0;}

.container{
position:relative;
z-index:1;
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:rgba(0,0,0,0.8);
padding:20px;
border-radius:20px;
margin-bottom:20px;
backdrop-filter:blur(8px);
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
margin-bottom:20px;
}

/* login */

#loginTela{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.loginBox{
background:#111827;
padding:30px;
border-radius:20px;
width:320px;
}

input,
select{
padding:12px;
border:none;
border-radius:10px;
margin:5px;
font-size:15px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin:5px;
font-size:15px;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

ul{
padding:0;
}

li{
list-style:none;
margin:10px 0;
}

.removeBtn{
background:red;
color:white;
margin-left:10px;
}

/* times */

#times{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:20px;
}

.time{
background:rgba(0,0,0,0.82);
padding:15px;
border-radius:18px;
}

.time h3{
color:#60a5fa;
margin-bottom:10px;
}

.player{
background:rgba(255,255,255,0.08);
padding:8px;
margin:6px 0;
border-radius:8px;
}

/* animação */

#animacao{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:42px;
z-index:9999;
}

.hidden{
display:none !important;
}

.glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{

from{
opacity:0.5;
transform:scale(1);
}

to{
opacity:1;
transform:scale(1.08);
}

}

/* mobile */

@media(max-width:900px){

.lateral{
display:none;
}

input,
select,
button{
width:100%;
}

}

</style>

</head>

<body>

<!-- imagens laterais -->

<img src="MeM.jpg" class="lateral left">
<img src="MeM.jpg" class="lateral right">

<!-- LOGIN -->

<div id="loginTela">

<div class="loginBox">

<h2 style="margin-bottom:20px;">
🏐 M&M VÔLEI PRO
</h2>

<button onclick="entrarVisitante()">
👤 Entrar como Visitante
</button>

<hr style="margin:20px 0;">

<input
type="password"
id="senhaAdmin"
placeholder="Senha Admin"
>

<button onclick="entrarAdmin()">
👑 Entrar como Admin
</button>

</div>

</div>

<!-- animação -->

<div id="animacao" class="hidden">

<div class="glow">
🏐 SORTEANDO TIMES...
</div>

<h2 id="nomeAnimado"></h2>

</div>

<div class="container">

<h1>
🏐 M&M VÔLEI PRO
</h1>

<!-- admin -->

<div id="adminArea" class="card hidden">

<input id="nome" placeholder="Nome do atleta">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button onclick="add()">
➕ Adicionar
</button>

<button onclick="sortearAnimado()">
🎲 Sortear
</button>

<button onclick="exportarImagem()">
📸 Exportar
</button>

</div>

<!-- jogadores -->

<div class="card">

<h2 style="margin-bottom:20px;">
Jogadores
</h2>

<ul id="lista"></ul>

</div>

<!-- gráfico -->

<div class="card">

<canvas id="grafico"></canvas>

</div>

<!-- times -->

<div id="times"></div>

<!-- fila -->

<div id="fila" class="card">

<h2 style="margin-bottom:15px;">
Fila
</h2>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */

const firebaseConfig = {

apiKey: "AIzaSyDNBTUXydUU8gxdteO4_dwQn65WpLGoRV4",
authDomain: "sorteio-de-times-aleatorios.firebaseapp.com",
projectId: "sorteio-de-times-aleatorios",
storageBucket: "sorteio-de-times-aleatorios.firebasestorage.app",
messagingSenderId: "169025334598",
appId: "1:169025334598:web:dcae7c136755b4f0d80947"

};

const appFirebase = initializeApp(firebaseConfig);

const db = getFirestore(appFirebase);

const ref = doc(db,"app","dados");

/* senha */

const SENHA = "147580";

/* estado */

let admin = false;

let jogadores = [];
let times = [];
let fila = [];

/* realtime */

onSnapshot(ref,(snapshot)=>{

try{

if(snapshot.exists()){

const dados = snapshot.data();

jogadores = Array.isArray(dados.jogadores)
? dados.jogadores
: [];

times = Array.isArray(dados.times)
? dados.times
: [];

fila = Array.isArray(dados.fila)
? dados.fila
: [];

render();

}

}catch(e){

console.error("ERRO SNAPSHOT:",e);

}

});

/* salvar */

async function salvar(){

try{

await setDoc(ref,{
jogadores,
times,
fila
});

}catch(e){

console.error("ERRO FIREBASE:",e);

throw e;

}

}

/* login */

window.entrarVisitante = function(){

document
.getElementById("loginTela")
.classList.add("hidden");

};

window.entrarAdmin = function(){

let senha =
document.getElementById("senhaAdmin").value;

if(senha === SENHA){

admin = true;

document
.getElementById("loginTela")
.classList.add("hidden");

document
.getElementById("adminArea")
.classList.remove("hidden");

}else{

alert("Senha incorreta");

}

};

/* add */

window.add = async function(){

if(!admin)return;

let nome =
document.getElementById("nome").value.trim();

let genero =
document.getElementById("genero").value;

let nivel =
parseInt(
document.getElementById("nivel").value
);

if(nome === ""){

alert("Digite um nome");
return;

}

let existe = jogadores.some(j=>
j.nome.toLowerCase() === nome.toLowerCase()
);

if(existe){

alert("Jogador já cadastrado");
return;

}

jogadores.push({
nome,
genero,
nivel
});

await salvar();

document.getElementById("nome").value = "";
document.getElementById("nome").focus();

};

/* remover */

window.removerJogador = async function(nome){

if(!admin)return;

jogadores = jogadores.filter(
j => j.nome !== nome
);

await salvar();

};

/* soma */

function soma(time){

if(!Array.isArray(time)){
return 0;
}

return time.reduce((a,j)=>{

return a + (Number(j.nivel)||0);

},0);

}

/* sorteio */

function sortear(){

times = [];
fila = [];

/* separa */

let homens = jogadores
.filter(j=>j.genero==="M");

let mulheres = jogadores
.filter(j=>j.genero==="F");

/* embaralha */

homens.sort(()=>Math.random()-0.5);
mulheres.sort(()=>Math.random()-0.5);

/* qtd times */

let qtdTimes = Math.floor(
Math.min(
homens.length/2,
mulheres.length/2
)
);

/* monta */

for(let i=0;i<qtdTimes;i++){

let time = [];

/* homens */

if(homens.length>0){
time.push(homens.shift());
}

if(homens.length>0){
time.push(homens.shift());
}

/* mulheres */

if(mulheres.length>0){
time.push(mulheres.shift());
}

if(mulheres.length>0){
time.push(mulheres.shift());
}

/* adiciona */

times.push(time);

}

/* sobra */

fila.push(...homens);
fila.push(...mulheres);

}

/* animação */

window.sortearAnimado = function(){

if(!admin)return;

if(jogadores.length < 4){

alert("Cadastre atletas suficientes");
return;

}

let tela =
document.getElementById("animacao");

let nomeAnimado =
document.getElementById("nomeAnimado");

tela.classList.remove("hidden");

let i = 0;

let intervalo = setInterval(()=>{

if(jogadores.length>0){

nomeAnimado.innerHTML =
jogadores[i % jogadores.length].nome;

i++;

}

},100);

/* FINAL */

setTimeout(async()=>{

clearInterval(intervalo);

try{

sortear();

await salvar();

render();

}catch(erro){

console.error("ERRO REAL:",erro);

alert(
"ERRO:\n\n" +
erro.message +
"\n\nAbra F12 para detalhes."
);

}

tela.classList.add("hidden");

},3000);

};

/* render */

function render(){

try{

/* lista */

let ul =
document.getElementById("lista");

ul.innerHTML = "";

jogadores.forEach(j=>{

ul.innerHTML += `

<li>

${j.nome}
(${j.genero} N${j.nivel})

${admin
?
`<button class="removeBtn" onclick="removerJogador('${j.nome}')">❌</button>`
:
""
}

</li>

`;

});

/* times */

let div =
document.getElementById("times");

div.innerHTML = "";

times.forEach((t,i)=>{

div.innerHTML += `

<div class="time">

<h3>
🏐 TIME ${i+1}
</h3>

<p style="margin-bottom:10px;">
⭐ Nível Total:
${soma(t)}
</p>

${t.map(j=>`

<div class="player">
${j.nome}
(${j.genero} N${j.nivel})
</div>

`).join("")}

</div>

`;

});

/* fila */

let filaDiv =
document.getElementById("fila");

filaDiv.innerHTML = `
<h2 style="margin-bottom:15px;">
Fila
</h2>
`;

if(fila.length === 0){

filaDiv.innerHTML += `
<p>
Nenhum atleta na fila
</p>
`;

}else{

fila.forEach(j=>{

filaDiv.innerHTML += `
<p>
${j.nome}
(${j.genero} N${j.nivel})
</p>
`;

});

}

/* gráfico */

grafico();

}catch(e){

console.error("ERRO RENDER:",e);

}

}

/* gráfico */

function grafico(){

try{

const canvas =
document.getElementById("grafico");

if(!canvas)return;

const ctx =
canvas.getContext("2d");

if(!ctx)return;

/* destrói */

if(window.graficoObj){

window.graficoObj.destroy();

}

/* dados */

const labels =
times.map((_,i)=>`Time ${i+1}`);

const dados =
times.map(t=>soma(t));

/* cria */

window.graficoObj = new Chart(ctx,{

type:"bar",

data:{

labels:labels,

datasets:[{

label:"Nível Total",

data:dados

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:"white"
}
}
},

scales:{

x:{
ticks:{
color:"white"
}
},

y:{
beginAtZero:true,
ticks:{
color:"white"
}
}

}

}

});

}catch(e){

console.error("ERRO GRAFICO:",e);

}

}

/* exportar */

window.exportarImagem = function(){

html2canvas(
document.getElementById("times")
).then(canvas=>{

let link =
document.createElement("a");

link.download = "times.png";

link.href = canvas.toDataURL();

link.click();

});

};

</script>

</body>
</html>
