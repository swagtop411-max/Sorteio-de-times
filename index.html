<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M VÔLEI PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:rgba(0,0,0,0.75);
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input,select,button{
padding:12px;
border:none;
border-radius:10px;
margin:5px;
font-size:15px;
}

button{
cursor:pointer;
font-weight:bold;
}

#times{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:20px;
}

.time{
background:rgba(0,0,0,0.8);
padding:15px;
border-radius:18px;
}

.player{
background:rgba(255,255,255,0.08);
padding:8px;
margin:6px 0;
border-radius:8px;
}

.hidden{
display:none !important;
}

/* login */

#loginTela{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.loginBox{
background:#111827;
padding:30px;
border-radius:20px;
width:320px;
}

/* animação */

#animacao{
position:fixed;
inset:0;
background:rgba(0,0,0,0.94);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:40px;
z-index:999;
}

.glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{

from{
opacity:0.5;
transform:scale(1);
}

to{
opacity:1;
transform:scale(1.1);
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginTela">

<div class="loginBox">

<h2>🏐 M&M VÔLEI PRO</h2>

<button onclick="entrarVisitante()">
👤 Visitante
</button>

<hr>

<input
type="password"
id="senhaAdmin"
placeholder="Senha Admin"
>

<button onclick="entrarAdmin()">
👑 Admin
</button>

</div>

</div>

<!-- animação -->

<div id="animacao" class="hidden">

<div class="glow">
🏐 SORTEANDO TIMES...
</div>

<h2 id="nomeAnimado"></h2>

</div>

<div class="container">

<h1>🏐 M&M VÔLEI PRO</h1>

<!-- admin -->

<div id="adminArea" class="card hidden">

<input id="nome" placeholder="Nome do atleta">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button onclick="add()">
➕ Adicionar
</button>

<button onclick="sortearAnimado()">
🎲 Sortear
</button>

<button onclick="exportarImagem()">
📸 Exportar
</button>

</div>

<!-- jogadores -->

<div class="card">

<h2>Jogadores</h2>

<ul id="lista"></ul>

</div>

<!-- gráfico -->

<div class="card">

<canvas id="grafico"></canvas>

</div>

<!-- times -->

<div id="times"></div>

<!-- fila -->

<div id="fila" class="card"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */

const firebaseConfig = {

apiKey: "AIzaSyDNBTUXydUU8gxdteO4_dwQn65WpLGoRV4",
authDomain: "sorteio-de-times-aleatorios.firebaseapp.com",
projectId: "sorteio-de-times-aleatorios",
storageBucket: "sorteio-de-times-aleatorios.firebasestorage.app",
messagingSenderId: "169025334598",
appId: "1:169025334598:web:dcae7c136755b4f0d80947"

};

const appFirebase=initializeApp(firebaseConfig);

const db=getFirestore(appFirebase);

const ref=doc(db,"app","dados");

/* senha */

const SENHA="147580";

let admin=false;

/* dados */

let jogadores=[];
let times=[];
let fila=[];

/* realtime */

onSnapshot(ref,(snapshot)=>{

if(snapshot.exists()){

const dados=snapshot.data();

jogadores=dados.jogadores || [];
times=dados.times || [];
fila=dados.fila || [];

render();

}

});

/* salvar */

async function salvar(){

await setDoc(ref,{
jogadores,
times,
fila
});

}

/* login */

window.entrarVisitante=function(){

document
.getElementById("loginTela")
.classList.add("hidden");

};

window.entrarAdmin=function(){

let senha=
document.getElementById("senhaAdmin").value;

if(senha===SENHA){

admin=true;

document
.getElementById("loginTela")
.classList.add("hidden");

document
.getElementById("adminArea")
.classList.remove("hidden");

}else{

alert("Senha incorreta");

}

};

/* add */

window.add=async function(){

if(!admin)return;

let nome=
document.getElementById("nome").value.trim();

let genero=
document.getElementById("genero").value;

let nivel=parseInt(
document.getElementById("nivel").value
);

if(nome==="")return;

jogadores.push({
nome,
genero,
nivel
});

await salvar();

document.getElementById("nome").value="";

};

/* soma */

function soma(time){

if(!time)return 0;

return time.reduce(
(a,j)=>a+(j.nivel || 0),
0
);

}

/* sorteio */

function sortear(){

times=[];
fila=[];

let homens=[...jogadores]
.filter(j=>j.genero==="M");

let mulheres=[...jogadores]
.filter(j=>j.genero==="F");

let qtd=Math.floor(
Math.min(homens.length/2,mulheres.length/2)
);

if(qtd<=0){

alert("Atletas insuficientes");

return;

}

/* criar times */

for(let i=0;i<qtd;i++){

times.push([]);

}

/* distribuir */

for(let i=0;i<qtd;i++){

if(homens[0])times[i].push(homens.shift());
if(homens[0])times[i].push(homens.shift());

if(mulheres[0])times[i].push(mulheres.shift());
if(mulheres[0])times[i].push(mulheres.shift());

}

/* fila */

fila.push(...homens);
fila.push(...mulheres);

}

/* animação */

window.sortearAnimado=function(){

let tela=document.getElementById("animacao");

let nomeAnimado=document.getElementById("nomeAnimado");

tela.classList.remove("hidden");

let i=0;

let intervalo=setInterval(()=>{

if(jogadores.length>0){

nomeAnimado.innerHTML=
jogadores[i % jogadores.length].nome;

i++;

}

},100);

setTimeout(async()=>{

clearInterval(intervalo);

try{

sortear();

await salvar();

render();

}catch(e){

console.error(e);

alert("Erro no sorteio");

}

tela.classList.add("hidden");

},3000);

};

/* render */

function render(){

/* lista */

let ul=document.getElementById("lista");

ul.innerHTML="";

jogadores.forEach(j=>{

ul.innerHTML+=`
<li>
${j.nome} (${j.genero} N${j.nivel})
</li>
`;

});

/* times */

let div=document.getElementById("times");

div.innerHTML="";

times.forEach((t,i)=>{

div.innerHTML+=`

<div class="time">

<h3>
🏐 TIME ${i+1}
</h3>

<p>
⭐ Nível:
${soma(t)}
</p>

<hr>

${t.map(j=>`

<div class="player">
${j.nome} (${j.genero} N${j.nivel})
</div>

`).join("")}

</div>

`;

});

/* fila */

let filaDiv=document.getElementById("fila");

filaDiv.innerHTML=`
<h2>Fila</h2>
`;

fila.forEach(j=>{

filaDiv.innerHTML+=`
<p>
${j.nome} (${j.genero} N${j.nivel})
</p>
`;

});

/* gráfico */

grafico();

}

/* gráfico */

function grafico(){

const canvas=document.getElementById("grafico");

if(!canvas)return;

const ctx=canvas.getContext("2d");

if(window.graficoObj){

window.graficoObj.destroy();

}

window.graficoObj=new Chart(ctx,{

type:"bar",

data:{

labels:times.map(
(_,i)=>`Time ${i+1}`
),

datasets:[{

label:"Nível Total",

data:times.map(t=>soma(t))

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:"white"
}
}
},

scales:{

x:{
ticks:{
color:"white"
}
},

y:{
beginAtZero:true,
ticks:{
color:"white"
}
}

}

}

});

}

/* exportar */

window.exportarImagem=function(){

html2canvas(
document.getElementById("times")
).then(canvas=>{

let link=document.createElement("a");

link.download="times.png";

link.href=canvas.toDataURL();

link.click();

});

};

</script>

</body>
</html>
