<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M Vôlei PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
  color:white;
  text-align:center;
}

/* laterais */
.lateral{
  position:fixed;
  top:0;
  height:100%;
  z-index:0;
  width:120px;
  object-fit:cover;
  opacity:0.25;
}

.left{left:0;}
.right{right:0;}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
  position:relative;
  z-index:1;
}

.card{
  background:rgba(0,0,0,0.7);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

.remove{
  background:red;
  color:white;
}

.time{
  background:rgba(0,0,0,0.7);
  border-radius:10px;
  padding:10px;
}

#times{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.hidden{
  display:none;
}

input,select{
  padding:10px;
  border-radius:8px;
  border:none;
  margin:5px;
}

li{
  list-style:none;
  margin:8px 0;
}

#grafico{
  margin-top:20px;
  margin-bottom:20px;
}

@media(max-width:768px){

.lateral{
display:none;
}

.container{
padding:10px;
}

button{
width:100%;
}

input,select{
width:100%;
margin-bottom:10px;
}

}

</style>
</head>

<body>

<img src="MeM.jpg" class="lateral left">
<img src="MeM.jpg" class="lateral right">

<div class="container">

<!-- LOGIN -->
<div id="login">

<h2>🏐 M&M VOLEI</h2>

<button onclick="modoVisitante()">👤 Entrar como Visitante</button>

<button onclick="abrirLogin()">👑 Administrador</button>

<div id="senhaBox" class="hidden">

<input type="password" id="senha" placeholder="Senha">

<button onclick="loginAdm()">Entrar</button>

</div>

</div>

<!-- APP -->
<div id="app" class="hidden">

<h2>🏐 M&M VOLEI PRO</h2>

<!-- AREA ADMIN -->
<div id="adminArea" class="card hidden">

<input id="nome" placeholder="Nome do jogador">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button onclick="add()">Adicionar</button>

</div>

<!-- LISTA -->
<div class="card">

<h3>Jogadores</h3>

<ul id="lista"></ul>

</div>

<!-- BOTOES -->
<div id="adminBtns" class="hidden">

<button onclick="reorganizar()">🎮 Refazer</button>

<button onclick="corrigirTimes()">🤖 Corrigir</button>

<button onclick="resetar()">♻️ Resetar</button>

</div>

<div id="alerta"></div>

<div id="sugestao"></div>

<!-- GRAFICO -->
<canvas id="grafico"></canvas>

<!-- TIMES -->
<div id="times"></div>

<!-- FILA -->
<div id="fila"></div>

</div>

</div>

<script>

/* senha */
const SENHA="147580";

/* modo */
let modo="visitante";

/* dados */
let jogadores=[];
let fila=[];
let times=[];

/* visitante */
function modoVisitante(){
modo="visitante";
entrarApp();
}

/* abrir login */
function abrirLogin(){
document.getElementById("senhaBox")
.classList.remove("hidden");
}

/* login */
function loginAdm(){

let senha=document
.getElementById("senha")
.value;

if(senha===SENHA){

modo="admin";

entrarApp();

}else{

alert("Senha incorreta");

}

}

/* entrar */
function entrarApp(){

document.getElementById("login")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

if(modo==="admin"){

document.getElementById("adminArea")
.classList.remove("hidden");

document.getElementById("adminBtns")
.classList.remove("hidden");

}

render();

}

/* salvar */
function salvar(){

localStorage.setItem(
"dados",
JSON.stringify({
jogadores,
fila,
times
})
);

}

/* carregar */
function carregar(){

let d=JSON.parse(
localStorage.getItem("dados")||"{}"
);

jogadores=d.jogadores||[];
fila=d.fila||[];
times=d.times||[];

}

/* adicionar jogador */
function add(){

if(modo!=="admin") return;

let nome=document
.getElementById("nome")
.value
.trim();

let genero=document
.getElementById("genero")
.value;

let nivel=parseInt(
document.getElementById("nivel").value
);

/* valida nome */
if(nome===""){

alert("Digite um nome");

return;

}

/* evitar repetidos */
let existe=jogadores.some(
j=>j.nome.toLowerCase()===nome.toLowerCase()
);

if(existe){

alert("Jogador já cadastrado");

return;

}

let j={
nome,
genero,
nivel
};

jogadores.push(j);

fila.push(j);

balancear();

salvar();

render();

/* limpar */
document.getElementById("nome").value="";
document.getElementById("nome").focus();

document.getElementById("genero").value="M";

document.getElementById("nivel").value="1";

}

/* remover */
function removerJogador(nome){

if(modo!=="admin") return;

jogadores=jogadores.filter(
j=>j.nome!==nome
);

fila=fila.filter(
j=>j.nome!==nome
);

times=times.map(t=>
t.filter(j=>j.nome!==nome)
);

times=times.filter(
t=>t.length>0
);

balancear();

salvar();

render();

}

/* balanceamento inteligente */
function balancear(){

let pool=[
...fila,
...times.flat()
];

/* reset */
times=[];
fila=[];

/* separar */
let homens=pool
.filter(j=>j.genero==="M")
.sort((a,b)=>b.nivel-a.nivel);

let mulheres=pool
.filter(j=>j.genero==="F")
.sort((a,b)=>b.nivel-a.nivel);

/* qtd times */
let qtd=Math.floor(
Math.min(
homens.length/2,
mulheres.length/2
)
);

/* cria times */
for(let i=0;i<qtd;i++){

times.push([]);

}

/* distribuir */
function distribuir(lista){

let direcao=1;
let indice=0;

lista.forEach(j=>{

times[indice].push(j);

if(direcao===1){

indice++;

if(indice>=times.length){

indice=times.length-1;

direcao=-1;

}

}else{

indice--;

if(indice<0){

indice=0;

direcao=1;

}

}

});

}

/* distribuição */
distribuir(homens);
distribuir(mulheres);

/* fila */
let usados=times.flat();

fila=pool.filter(
j=>!usados.includes(j)
);

}

/* soma nivel */
function soma(t){

return t.reduce(
(a,j)=>a+j.nivel,
0
);

}

/* render */
function render(){

/* lista */
let ul=document.getElementById("lista");

ul.innerHTML="";

jogadores.forEach(j=>{

ul.innerHTML+=`
<li>

${j.nome} (${j.genero} N${j.nivel})

${modo==="admin"
?
`<button class="remove" onclick="removerJogador('${j.nome}')">❌</button>`
:
""
}

</li>
`;

});

/* times */
let div=document.getElementById("times");

div.innerHTML="";

times.forEach((t,i)=>{

div.innerHTML+=`

<div class="time">

<h3>
Time ${i+1} (${soma(t)})
</h3>

${t.map(j=>`
<p>
${j.nome} - N${j.nivel}
</p>
`).join("")}

</div>

`;

});

/* fila */
let f=document.getElementById("fila");

f.innerHTML="<h3>Fila</h3>";

if(fila.length===0){

f.innerHTML+="<p>Nenhum jogador na fila</p>";

}else{

fila.forEach(j=>{

f.innerHTML+=`
<p>
${j.nome} (${j.genero} N${j.nivel})
</p>
`;

});

}

/* gráfico */
grafico();

}

/* grafico */
function grafico(){

let ctx=document
.getElementById("grafico");

let dados=times.map(t=>soma(t));

if(window.graficoObj){

window.graficoObj.destroy();

}

window.graficoObj=new Chart(ctx,{

type:'bar',

data:{

labels:times.map(
(_,i)=>"Time "+(i+1)
),

datasets:[{

label:'Nível Total',

data:dados,

borderWidth:1

}]

},

options:{

responsive:true,

plugins:{

legend:{
labels:{
color:'white'
}
}

},

scales:{

x:{
ticks:{
color:'white'
}
},

y:{
beginAtZero:true,
ticks:{
color:'white'
}
}

}

}

});

}

/* botoes */
function reorganizar(){

balancear();

salvar();

render();

}

function corrigirTimes(){

balancear();

salvar();

render();

}

function resetar(){

times=[];

fila=[...jogadores];

balancear();

salvar();

render();

}

/* iniciar */
carregar();

</script>

</body>
</html>
