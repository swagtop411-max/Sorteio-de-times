<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M VÔLEI PRO</title>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:
linear-gradient(
135deg,
#020617,
#0f172a,
#1e3a8a
);
color:white;
overflow-x:hidden;
text-align:center;
}

/* laterais */

.lateral{
position:fixed;
top:0;
height:100%;
width:420px;
object-fit:cover;
opacity:0.95;
pointer-events:none;
z-index:0;
filter:
drop-shadow(0 0 25px rgba(0,0,0,0.5));
}

.left{
left:0;
}

.right{
right:0;
}

/* overlay */

body::before{
content:"";
position:fixed;
inset:0;
background:
rgba(0,0,0,0.18);
z-index:0;
pointer-events:none;
}

/* container */

.container{
position:relative;
z-index:2;
max-width:1250px;
margin:auto;
padding:20px;
}

/* cards */

.card{
background:
rgba(0,0,0,0.78);
padding:22px;
border-radius:24px;
margin-bottom:22px;
backdrop-filter:blur(10px);
box-shadow:
0 0 25px rgba(0,0,0,0.35);
border:
1px solid rgba(255,255,255,0.08);
}

/* titulo */

h1{
font-size:48px;
margin-bottom:25px;
text-shadow:
0 0 20px rgba(255,255,255,0.15);
}

/* login */

#loginTela{
position:fixed;
inset:0;
background:
rgba(0,0,0,0.94);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.loginBox{
background:
linear-gradient(
145deg,
#111827,
#0f172a
);
padding:35px;
border-radius:25px;
width:340px;
box-shadow:
0 0 30px rgba(0,0,0,0.5);
}

/* inputs */

input,
select{
padding:13px;
border:none;
border-radius:12px;
margin:5px;
font-size:15px;
background:#f8fafc;
}

/* buttons */

button{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin:5px;
font-size:15px;
transition:0.2s;
}

button:hover{
transform:scale(1.04);
}

/* especiais */

.sortBtn{
background:#2563eb;
color:white;
}

.exportBtn{
background:#16a34a;
color:white;
}

.resetBtn{
background:#dc2626;
color:white;
}

.removeBtn{
background:#ef4444;
color:white;
padding:6px 10px;
font-size:12px;
margin-left:10px;
}

/* lista */

ul{
padding:0;
}

li{
list-style:none;
margin:10px 0;
background:
rgba(255,255,255,0.05);
padding:12px;
border-radius:12px;
}

/* times */

#times{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(290px,1fr));
gap:22px;
margin-top:20px;
}

.time{
background:
rgba(0,0,0,0.85);
padding:20px;
border-radius:22px;
box-shadow:
0 0 20px rgba(0,0,0,0.35);
border:
1px solid rgba(255,255,255,0.06);
}

.time h3{
color:#60a5fa;
margin-bottom:12px;
font-size:26px;
}

.player{
background:
rgba(255,255,255,0.08);
padding:10px;
margin:8px 0;
border-radius:10px;
}

/* ranking */

.rankItem{
padding:12px;
background:
rgba(255,255,255,0.06);
border-radius:12px;
margin:8px 0;
}

/* animação */

#animacao{
position:fixed;
inset:0;
background:
rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:55px;
z-index:9999;
}

.hidden{
display:none !important;
}

.glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{

from{
opacity:0.5;
transform:scale(1);
}

to{
opacity:1;
transform:scale(1.12);
}

}

/* tv */

#tv{
background:black;
padding:30px;
border-radius:25px;
margin-top:20px;
}

.tvTime{
margin-bottom:25px;
font-size:22px;
}

/* qr */

#qr{
margin-top:20px;
display:flex;
justify-content:center;
}

/* mobile */

@media(max-width:1100px){

.lateral{
width:260px;
opacity:0.55;
}

}

@media(max-width:900px){

.lateral{
display:none;
}

input,
select,
button{
width:100%;
}

h1{
font-size:34px;
}

}

</style>

</head>

<body>

<!-- LATERAIS -->

<img src="MeM.jpg" class="lateral left">
<img src="MeM.jpg" class="lateral right">

<!-- LOGIN -->

<div id="loginTela">

<div class="loginBox">

<h2 style="margin-bottom:20px;">
🏐 M&M VÔLEI PRO
</h2>

<button id="btnVisitante">
👤 Entrar Visitante
</button>

<hr style="margin:20px 0;">

<input
type="password"
id="senhaAdmin"
placeholder="Senha Admin"
>

<button id="btnAdmin">
👑 Entrar Admin
</button>

</div>

</div>

<!-- animação -->

<div id="animacao" class="hidden">

<div class="glow">
🏐 SORTEANDO TIMES...
</div>

<h2 id="nomeAnimado"></h2>

</div>

<div class="container">

<h1>
🏐 M&M VÔLEI PRO
</h1>

<!-- admin -->

<div id="adminArea" class="card hidden">

<input id="nome" placeholder="Nome do atleta">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button id="btnAdd">
➕ Adicionar
</button>

<button class="sortBtn" id="btnSortear">
🎲 Sortear
</button>

<button class="exportBtn" id="btnExportar">
📸 Exportar
</button>

<button id="btnTV">
📺 TV
</button>

<button class="resetBtn" id="btnResetar">
♻️ Resetar Sorteio
</button>

</div>

<!-- jogadores -->

<div class="card">

<h2 style="margin-bottom:20px;">
Jogadores
</h2>

<ul id="lista"></ul>

</div>

<!-- estatisticas -->

<div class="card">

<h2 style="margin-bottom:20px;">
📊 Estatísticas
</h2>

<canvas id="grafico"></canvas>

<div id="estatisticas" style="margin-top:20px;"></div>

</div>

<!-- ranking -->

<div class="card">

<h2 style="margin-bottom:20px;">
🏆 Ranking
</h2>

<div id="ranking"></div>

</div>

<!-- times -->

<div id="times"></div>

<!-- fila -->

<div id="fila" class="card">

<h2 style="margin-bottom:15px;">
🚨 Fila
</h2>

</div>

<!-- tv -->

<div id="tv" class="card hidden">

<h2 style="margin-bottom:25px;">
📺 PAINEL TV / OBS
</h2>

<div id="tvConteudo"></div>

</div>

<!-- qr -->

<div class="card">

<h2 style="margin-bottom:20px;">
📱 QR CODE DO APP
</h2>

<div id="qr"></div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */

const firebaseConfig = {

apiKey: "AIzaSyDNBTUXydUU8gxdteO4_dwQn65WpLGoRV4",
authDomain: "sorteio-de-times-aleatorios.firebaseapp.com",
projectId: "sorteio-de-times-aleatorios",
storageBucket: "sorteio-de-times-aleatorios.firebasestorage.app",
messagingSenderId: "169025334598",
appId: "1:169025334598:web:dcae7c136755b4f0d80947"

};

const appFirebase =
initializeApp(firebaseConfig);

const db =
getFirestore(appFirebase);

const ref =
doc(db,"app","dados");

/* estado */

const SENHA="147580";

let admin=false;

let jogadores=[];
let times=[];
let fila=[];

/* login visitante */

document
.getElementById("btnVisitante")
.addEventListener("click",()=>{

document
.getElementById("loginTela")
.classList.add("hidden");

});

/* login admin */

document
.getElementById("btnAdmin")
.addEventListener("click",()=>{

let senha=
document
.getElementById("senhaAdmin")
.value;

if(senha===SENHA){

admin=true;

document
.getElementById("loginTela")
.classList.add("hidden");

document
.getElementById("adminArea")
.classList.remove("hidden");

render();

}else{

alert("Senha incorreta");

}

});

/* realtime */

onSnapshot(ref,(snapshot)=>{

try{

if(snapshot.exists()){

const dados=snapshot.data();

jogadores=
Array.isArray(dados.jogadores)
? dados.jogadores
: [];

times=
Array.isArray(dados.times)
? dados.times
: [];

fila=
Array.isArray(dados.fila)
? dados.fila
: [];

render();

}

}catch(e){

console.error(e);

}

});

/* salvar */

async function salvar(){

await setDoc(ref,{
jogadores,
times,
fila
});

}

/* adicionar */

document
.getElementById("btnAdd")
.addEventListener("click",async()=>{

if(!admin)return;

let nome=
document
.getElementById("nome")
.value.trim();

let genero=
document
.getElementById("genero")
.value;

let nivel=
parseInt(
document
.getElementById("nivel")
.value
);

if(nome==="")return;

let existe=
jogadores.some(j=>
j.nome.toLowerCase()===
nome.toLowerCase()
);

if(existe){

alert("Jogador já cadastrado");
return;

}

jogadores.push({
nome,
genero,
nivel
});

await salvar();

document
.getElementById("nome")
.value="";

});

/* resetar */

document
.getElementById("btnResetar")
.addEventListener("click",async()=>{

if(!admin)return;

let confirmar=confirm(
"Resetar sorteio?\n\nOs atletas continuarão cadastrados."
);

if(!confirmar)return;

times=[];
fila=[];

await salvar();

render();

});

/* soma */

function soma(lista){

if(!Array.isArray(lista))return 0;

return lista.reduce((a,j)=>{

return a+
(Number(j.nivel)||0);

},0);

}

/* sorteio */

function sortear(){

times=[];
fila=[];

let homens=
jogadores.filter(
j=>j.genero==="M"
);

let mulheres=
jogadores.filter(
j=>j.genero==="F"
);

homens.sort(()=>Math.random()-0.5);
mulheres.sort(()=>Math.random()-0.5);

let qtdTimes=Math.floor(
Math.min(
homens.length/2,
mulheres.length/2
)
);

for(let i=0;i<qtdTimes;i++){

times.push({
numero:i+1,
jogadores:[]
});

}

for(let i=0;i<qtdTimes;i++){

if(homens.length>0)
times[i].jogadores.push(
homens.shift()
);

if(homens.length>0)
times[i].jogadores.push(
homens.shift()
);

if(mulheres.length>0)
times[i].jogadores.push(
mulheres.shift()
);

if(mulheres.length>0)
times[i].jogadores.push(
mulheres.shift()
);

}

fila.push(...homens);
fila.push(...mulheres);

}

/* sortear */

document
.getElementById("btnSortear")
.addEventListener("click",()=>{

if(!admin)return;

let tela=
document.getElementById(
"animacao"
);

let nomeAnimado=
document.getElementById(
"nomeAnimado"
);

tela.classList.remove(
"hidden"
);

let i=0;

let intervalo=
setInterval(()=>{

if(jogadores.length>0){

nomeAnimado.innerHTML=
jogadores[
i % jogadores.length
].nome;

i++;

}

},100);

setTimeout(async()=>{

clearInterval(intervalo);

try{

sortear();

await salvar();

render();

}catch(e){

console.error(e);

alert(e.message);

}

tela.classList.add(
"hidden"
);

},3000);

});

/* render */

function render(){

/* lista */

let ul=
document.getElementById(
"lista"
);

ul.innerHTML="";

jogadores.forEach(j=>{

ul.innerHTML+=`

<li>

${j.nome}
(${j.genero} N${j.nivel})

${admin
?
`<button class="removeBtn" data-nome="${j.nome}">
❌ Excluir
</button>`
:
""
}

</li>

`;

});

/* remover */

document
.querySelectorAll(".removeBtn")
.forEach(btn=>{

btn.addEventListener(
"click",
async()=>{

if(!admin)return;

let nome=
btn.dataset.nome;

let confirmar=
confirm(
"Excluir atleta?\n\n"+
nome
);

if(!confirmar)return;

jogadores=
jogadores.filter(
j=>j.nome!==nome
);

times.forEach(time=>{

time.jogadores=
time.jogadores.filter(
j=>j.nome!==nome
);

});

fila=
fila.filter(
j=>j.nome!==nome
);

await salvar();

render();

});

});

/* ranking */

let ranking=
document.getElementById(
"ranking"
);

ranking.innerHTML="";

[...jogadores]
.sort((a,b)=>b.nivel-a.nivel)
.forEach((j,i)=>{

ranking.innerHTML+=`

<div class="rankItem">

#${i+1}
-
${j.nome}
(N${j.nivel})

</div>

`;

});

/* times */

let div=
document.getElementById(
"times"
);

div.innerHTML="";

times.forEach(timeObj=>{

let t=timeObj.jogadores;

div.innerHTML+=`

<div class="time">

<h3>
🏐 TIME ${timeObj.numero}
</h3>

<p>
⭐ Nível Total:
${soma(t)}
</p>

${t.map(j=>`

<div class="player">
${j.nome}
(${j.genero} N${j.nivel})
</div>

`).join("")}

</div>

`;

});

/* fila */

let filaDiv=
document.getElementById(
"fila"
);

filaDiv.innerHTML=`
<h2 style="margin-bottom:15px;">
🚨 Fila
</h2>
`;

if(fila.length===0){

filaDiv.innerHTML+=`
<p>
Nenhum atleta na fila
</p>
`;

}else{

fila.forEach(j=>{

filaDiv.innerHTML+=`
<p>
${j.nome}
(${j.genero} N${j.nivel})
</p>
`;

});

}

/* estatísticas */

let estat=
document.getElementById(
"estatisticas"
);

estat.innerHTML=`

<p>
👥 Jogadores:
${jogadores.length}
</p>

<p>
🏐 Times:
${times.length}
</p>

<p>
🚨 Fila:
${fila.length}
</p>

`;

/* tv */

let tv=
document.getElementById(
"tvConteudo"
);

tv.innerHTML="";

times.forEach(timeObj=>{

tv.innerHTML+=`

<div class="tvTime">

<h2>
TIME ${timeObj.numero}
</h2>

<p>
⭐ ${soma(timeObj.jogadores)}
</p>

<p>
${timeObj.jogadores.map(
j=>j.nome
).join(" • ")}
</p>

</div>

`;

});

grafico();

gerarQR();

}

/* gráfico */

function grafico(){

try{

const canvas=
document.getElementById(
"grafico"
);

const ctx=
canvas.getContext("2d");

if(window.graficoObj){

window.graficoObj.destroy();

}

window.graficoObj=
new Chart(ctx,{

type:"bar",

data:{

labels:times.map(
t=>`Time ${t.numero}`
),

datasets:[{

label:"Nível Total",

data:times.map(
t=>soma(
t.jogadores
)
)

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:"white"
}
}
},

scales:{

x:{
ticks:{
color:"white"
}
},

y:{
beginAtZero:true,
ticks:{
color:"white"
}
}

}

}

});

}catch(e){

console.error(e);

}

}

/* exportar */

document
.getElementById("btnExportar")
.addEventListener("click",()=>{

html2canvas(
document.getElementById(
"times"
)
).then(canvas=>{

let link=
document.createElement("a");

link.download=
"times.png";

link.href=
canvas.toDataURL();

link.click();

});

});

/* tv */

document
.getElementById("btnTV")
.addEventListener("click",()=>{

document
.getElementById("tv")
.classList.toggle(
"hidden"
);

});

/* qr */

function gerarQR(){

let qrDiv=
document.getElementById(
"qr"
);

qrDiv.innerHTML="";

QRCode.toCanvas(
window.location.href,
{
width:220
},
function(error,canvas){

if(error)return;

qrDiv.appendChild(canvas);

});

}

</script>

</body>
</html>
