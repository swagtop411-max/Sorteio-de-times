<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M Vôlei PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
text-align:center;
overflow-x:hidden;
}

/* laterais */
.lateral{
position:fixed;
top:0;
height:100%;
width:260px;
object-fit:cover;
z-index:0;
opacity:0.95;
pointer-events:none;
}

.left{
left:0;
}

.right{
right:0;
}

/* container */
.container{
max-width:1000px;
margin:auto;
padding:20px;
position:relative;
z-index:1;
}

/* cards */
.card{
background:rgba(0,0,0,0.75);
padding:20px;
border-radius:16px;
margin-bottom:20px;
backdrop-filter:blur(8px);
box-shadow:0 0 20px rgba(0,0,0,0.35);
}

/* inputs */
input,select{
padding:12px;
border:none;
border-radius:10px;
margin:5px;
font-size:15px;
}

/* buttons */
button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
margin:5px;
transition:0.2s;
font-size:15px;
}

button:hover{
transform:scale(1.03);
opacity:0.95;
}

.remove{
background:#ff1e1e;
color:white;
}

/* grid */
#times{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
margin-top:20px;
}

/* time */
.time{
background:rgba(0,0,0,0.78);
border-radius:16px;
padding:15px;
box-shadow:0 0 15px rgba(0,0,0,0.35);
border:1px solid rgba(255,255,255,0.08);
}

.time h3{
margin-bottom:10px;
color:#60a5fa;
}

.time p{
margin:6px 0;
}

/* lista */
ul{
padding:0;
}

li{
list-style:none;
margin:10px 0;
}

/* fila */
#fila{
margin-top:30px;
background:rgba(0,0,0,0.75);
padding:20px;
border-radius:16px;
}

/* hidden */
.hidden{
display:none;
}

/* gráfico */
#grafico{
margin-top:30px;
margin-bottom:30px;
}

/* mobile */
@media(max-width:900px){

.lateral{
display:none;
}

.container{
padding:10px;
}

button{
width:100%;
}

input,select{
width:100%;
box-sizing:border-box;
}

}

</style>

</head>

<body>

<img src="MeM.jpg" class="lateral left">
<img src="MeM.jpg" class="lateral right">

<div class="container">

<!-- LOGIN -->
<div id="login">

<h2>🏐 M&M VÔLEI PRO</h2>

<button onclick="modoVisitante()">
👤 Entrar como Visitante
</button>

<button onclick="abrirLogin()">
👑 Administrador
</button>

<div id="senhaBox" class="hidden">

<input type="password" id="senha" placeholder="Senha">

<button onclick="loginAdm()">
Entrar
</button>

</div>

</div>

<!-- APP -->
<div id="app" class="hidden">

<h2>🏐 M&M VÔLEI PRO</h2>

<!-- ADMIN -->
<div id="adminArea" class="card hidden">

<h3>Cadastro de Atletas</h3>

<input id="nome" placeholder="Nome do atleta">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button onclick="add()">
➕ Adicionar
</button>

</div>

<!-- JOGADORES -->
<div class="card">

<h3>Jogadores Cadastrados</h3>

<ul id="lista"></ul>

</div>

<!-- BOTÕES -->
<div id="adminBtns" class="hidden">

<button onclick="sortearTimes()">
🎲 Fazer Sorteio
</button>

<button onclick="reorganizar()">
🎮 Refazer
</button>

<button onclick="resetarTimes()">
♻️ Resetar Times
</button>

</div>

<!-- GRAFICO -->
<canvas id="grafico"></canvas>

<!-- TIMES -->
<div id="times"></div>

<!-- FILA -->
<div id="fila"></div>

</div>

</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */
const firebaseConfig = {
apiKey: "AIzaSyDNBTUXydUU8gxdteO4_dwQn65WpLGoRV4",
authDomain: "sorteio-de-times-aleatorios.firebaseapp.com",
projectId: "sorteio-de-times-aleatorios",
storageBucket: "sorteio-de-times-aleatorios.firebasestorage.app",
messagingSenderId: "169025334598",
appId: "1:169025334598:web:dcae7c136755b4f0d80947",
measurementId: "G-HC4H5DK7DD"
};

const appFirebase=initializeApp(firebaseConfig);

const db=getFirestore(appFirebase);

/* senha */
const SENHA="147580";

/* modo */
let modo="visitante";

/* dados */
let jogadores=[];
let fila=[];
let times=[];

/* referência */
const ref=doc(db,"app","dados");

/* sincronização tempo real */
onSnapshot(ref,(snapshot)=>{

if(snapshot.exists()){

const dados=snapshot.data();

jogadores=dados.jogadores || [];
fila=dados.fila || [];
times=dados.times || [];

render();

}

});

/* salvar */
async function salvar(){

await setDoc(ref,{
jogadores,
fila,
times
});

}

/* visitante */
window.modoVisitante=function(){

modo="visitante";

entrarApp();

}

/* abrir login */
window.abrirLogin=function(){

document
.getElementById("senhaBox")
.classList.remove("hidden");

}

/* login */
window.loginAdm=function(){

let senha=document
.getElementById("senha")
.value;

if(senha===SENHA){

modo="admin";

entrarApp();

}else{

alert("Senha incorreta");

}

}

/* entrar */
function entrarApp(){

document
.getElementById("login")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

if(modo==="admin"){

document
.getElementById("adminArea")
.classList.remove("hidden");

document
.getElementById("adminBtns")
.classList.remove("hidden");

}

render();

}

/* adicionar */
window.add=async function(){

if(modo!=="admin") return;

let nome=document
.getElementById("nome")
.value
.trim();

let genero=document
.getElementById("genero")
.value;

let nivel=parseInt(
document.getElementById("nivel").value
);

if(nome===""){

alert("Digite um nome");
return;

}

let existe=jogadores.some(
j=>j.nome.toLowerCase()===nome.toLowerCase()
);

if(existe){

alert("Jogador já cadastrado");
return;

}

let jogador={
nome,
genero,
nivel
};

jogadores.push(jogador);

await salvar();

render();

/* limpa */
document.getElementById("nome").value="";
document.getElementById("nome").focus();

document.getElementById("genero").value="M";
document.getElementById("nivel").value="1";

}

/* remover */
window.removerJogador=async function(nome){

if(modo!=="admin") return;

jogadores=jogadores.filter(
j=>j.nome!==nome
);

times=times.map(t=>
t.filter(j=>j.nome!==nome)
);

fila=fila.filter(
j=>j.nome!==nome
);

times=times.filter(
t=>t.length>0
);

await salvar();

render();

}

/* soma */
function soma(t){

return t.reduce(
(a,j)=>a+j.nivel,
0
);

}

/* sorteio */
window.sortearTimes=async function(){

times=[];
fila=[];

/* separa */
let homens=[...jogadores]
.filter(j=>j.genero==="M")
.sort((a,b)=>b.nivel-a.nivel);

let mulheres=[...jogadores]
.filter(j=>j.genero==="F")
.sort((a,b)=>b.nivel-a.nivel);

/* qtd */
let qtdTimes=Math.floor(
Math.min(
homens.length/2,
mulheres.length/2
)
);

/* cria */
for(let i=0;i<qtdTimes;i++){

times.push([]);

}

/* encaixe */
function encaixar(jogador,genero){

let melhor=null;
let menorNivel=999;

times.forEach(t=>{

let qtd=t.filter(
j=>j.genero===genero
).length;

let total=soma(t);

if(
qtd<2 &&
(total+jogador.nivel)<=12
){

if(total<menorNivel){

menorNivel=total;
melhor=t;

}

}

});

if(melhor){

melhor.push(jogador);

}else{

fila.push(jogador);

}

}

/* distribui */
homens.forEach(j=>{
encaixar(j,"M");
});

mulheres.forEach(j=>{
encaixar(j,"F");
});

/* validar */
let completos=[];

times.forEach(t=>{

let h=t.filter(
j=>j.genero==="M"
).length;

let m=t.filter(
j=>j.genero==="F"
).length;

let total=soma(t);

if(
h===2 &&
m===2 &&
total<=12
){

completos.push(t);

}else{

fila.push(...t);

}

});

times=completos;

/* remover duplicados */
fila=fila.filter((j,index,self)=>
index===self.findIndex(
a=>a.nome===j.nome
)
);

await salvar();

render();

}

/* refazer */
window.reorganizar=function(){

sortearTimes();

}

/* reset */
window.resetarTimes=async function(){

times=[];
fila=[];

await salvar();

render();

}

/* render */
function render(){

/* lista */
let ul=document.getElementById("lista");

ul.innerHTML="";

jogadores.forEach(j=>{

ul.innerHTML+=`

<li>

${j.nome} (${j.genero} N${j.nivel})

${modo==="admin"
?
`<button class="remove" onclick="removerJogador('${j.nome}')">❌</button>`
:
""
}

</li>

`;

});

/* times */
let div=document.getElementById("times");

div.innerHTML="";

if(times.length===0){

div.innerHTML=`

<div class="card">

<h3>
Nenhum time sorteado
</h3>

</div>

`;

}else{

times.forEach((t,i)=>{

div.innerHTML+=`

<div class="time">

<h3>
🏐 TIME ${i+1}
</h3>

<p>
⭐ Nível Total:
<b>${soma(t)}</b>/12
</p>

<hr>

${t.map(j=>`

<p>
${j.nome}
(${j.genero} N${j.nivel})
</p>

`).join("")}

</div>

`;

});

}

/* fila */
let f=document.getElementById("fila");

f.innerHTML="<h3>Fila</h3>";

if(fila.length===0){

f.innerHTML+=`

<p>
Nenhum atleta na fila
</p>

`;

}else{

fila.forEach(j=>{

f.innerHTML+=`

<p>
${j.nome}
(${j.genero} N${j.nivel})
</p>

`;

});

}

/* gráfico */
grafico();

}

/* gráfico */
function grafico(){

let ctx=document
.getElementById("grafico");

let dados=times.map(
t=>soma(t)
);

if(window.graficoObj){

window.graficoObj.destroy();

}

window.graficoObj=new Chart(ctx,{

type:'bar',

data:{

labels:times.map(
(_,i)=>"Time "+(i+1)
),

datasets:[{

label:'Nível Total',

data:dados,

borderWidth:1

}]

},

options:{

responsive:true,

plugins:{

legend:{
labels:{
color:'white'
}
}

},

scales:{

x:{
ticks:{
color:'white'
}
},

y:{
beginAtZero:true,
max:12,
ticks:{
color:'white'
}
}

}

}

});

}

</script>

</body>
</html>
