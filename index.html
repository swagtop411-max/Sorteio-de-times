<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M&M VÔLEI PRO</title>

<!-- LIBS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
overflow-x:hidden;
text-align:center;
}

/* laterais */

.lateral{
position:fixed;
top:0;
height:100%;
width:340px;
object-fit:cover;
opacity:0.95;
pointer-events:none;
z-index:0;
}

.left{left:0;}
.right{right:0;}

/* container */

.container{
position:relative;
z-index:1;
max-width:1300px;
margin:auto;
padding:20px;
}

/* cards */

.card{
background:rgba(0,0,0,0.82);
padding:20px;
border-radius:22px;
margin-bottom:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 25px rgba(0,0,0,0.35);
}

/* títulos */

h1{
margin-bottom:20px;
font-size:42px;
}

/* login */

#loginTela{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.loginBox{
background:#111827;
padding:35px;
border-radius:25px;
width:340px;
}

/* inputs */

input,
select{
padding:12px;
border:none;
border-radius:12px;
margin:5px;
font-size:15px;
}

/* buttons */

button{
padding:12px 18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin:5px;
font-size:15px;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

/* especiais */

.resetBtn{
background:#dc2626;
color:white;
}

.exportBtn{
background:#16a34a;
color:white;
}

.sortBtn{
background:#2563eb;
color:white;
}

/* lista */

ul{
padding:0;
}

li{
list-style:none;
margin:10px 0;
}

/* remover */

.removeBtn{
background:red;
color:white;
margin-left:10px;
}

/* times */

#times{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
margin-top:20px;
}

.time{
background:rgba(0,0,0,0.86);
padding:18px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.35);
min-height:220px;
}

.time h3{
color:#60a5fa;
margin-bottom:10px;
font-size:24px;
}

.player{
background:rgba(255,255,255,0.08);
padding:10px;
margin:8px 0;
border-radius:10px;
}

/* animação */

#animacao{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:52px;
z-index:9999;
}

.hidden{
display:none !important;
}

.glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{

from{
opacity:0.5;
transform:scale(1);
}

to{
opacity:1;
transform:scale(1.1);
}

}

/* tv */

#tv{
background:black;
padding:30px;
border-radius:25px;
margin-top:20px;
}

.tvTime{
margin-bottom:25px;
font-size:22px;
}

/* qr */

#qr{
margin-top:20px;
display:flex;
justify-content:center;
}

/* ranking */

.rankItem{
padding:10px;
background:rgba(255,255,255,0.08);
border-radius:10px;
margin:8px 0;
}

/* mobile */

@media(max-width:900px){

.lateral{
display:none;
}

input,
select,
button{
width:100%;
}

}

</style>

</head>

<body>

<!-- laterais -->

<img src="MeM.jpg" class="lateral left">
<img src="MeM.jpg" class="lateral right">

<!-- LOGIN -->

<div id="loginTela">

<div class="loginBox">

<h2 style="margin-bottom:20px;">
🏐 M&M VÔLEI PRO
</h2>

<button onclick="entrarVisitante()">
👤 Entrar Visitante
</button>

<hr style="margin:20px 0;">

<input
type="password"
id="senhaAdmin"
placeholder="Senha Admin"
>

<button onclick="entrarAdmin()">
👑 Entrar Admin
</button>

</div>

</div>

<!-- animação -->

<div id="animacao" class="hidden">

<div class="glow">
🏐 SORTEANDO TIMES...
</div>

<h2 id="nomeAnimado"></h2>

</div>

<div class="container">

<h1>
🏐 M&M VÔLEI PRO
</h1>

<!-- admin -->

<div id="adminArea" class="card hidden">

<input id="nome" placeholder="Nome do atleta">

<select id="genero">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>

<select id="nivel">
<option value="1">N1</option>
<option value="2">N2</option>
<option value="3">N3</option>
<option value="4">N4</option>
<option value="5">N5</option>
</select>

<button onclick="add()">
➕ Adicionar
</button>

<button class="sortBtn" onclick="sortearAnimado()">
🎲 Sortear
</button>

<button class="exportBtn" onclick="exportarImagem()">
📸 Exportar
</button>

<button onclick="abrirTV()">
📺 TV
</button>

<button class="resetBtn" onclick="resetarSorteio()">
♻️ Resetar Sorteio
</button>

</div>

<!-- jogadores -->

<div class="card">

<h2 style="margin-bottom:20px;">
Jogadores
</h2>

<ul id="lista"></ul>

</div>

<!-- gráfico -->

<div class="card">

<h2 style="margin-bottom:20px;">
📊 Estatísticas
</h2>

<canvas id="grafico"></canvas>

<div id="estatisticas" style="margin-top:20px;"></div>

</div>

<!-- ranking -->

<div class="card">

<h2 style="margin-bottom:20px;">
🏆 Ranking
</h2>

<div id="ranking"></div>

</div>

<!-- times -->

<div id="times"></div>

<!-- fila -->

<div id="fila" class="card">

<h2 style="margin-bottom:15px;">
🚨 Fila
</h2>

</div>

<!-- tv -->

<div id="tv" class="card hidden">

<h2 style="margin-bottom:25px;">
📺 PAINEL TV / OBS
</h2>

<div id="tvConteudo"></div>

</div>

<!-- qr -->

<div class="card">

<h2 style="margin-bottom:20px;">
📱 QR CODE DO APP
</h2>

<div id="qr"></div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyDNBTUXydUU8gxdteO4_dwQn65WpLGoRV4",
authDomain: "sorteio-de-times-aleatorios.firebaseapp.com",
projectId: "sorteio-de-times-aleatorios",
storageBucket: "sorteio-de-times-aleatorios.firebasestorage.app",
messagingSenderId: "169025334598",
appId: "1:169025334598:web:dcae7c136755b4f0d80947"

};

const appFirebase = initializeApp(firebaseConfig);

const db = getFirestore(appFirebase);

const ref = doc(db,"app","dados");

/* senha */

const SENHA = "147580";

/* estado */

let admin = false;

let jogadores = [];
let times = [];
let fila = [];

/* realtime */

onSnapshot(ref,(snapshot)=>{

try{

if(snapshot.exists()){

const dados = snapshot.data();

jogadores = Array.isArray(dados.jogadores)
? dados.jogadores
: [];

times = Array.isArray(dados.times)
? dados.times
: [];

fila = Array.isArray(dados.fila)
? dados.fila
: [];

render();

}

}catch(e){

console.error(e);

}

});

/* salvar */

async function salvar(){

await setDoc(ref,{
jogadores,
times,
fila
});

}

/* login */

window.entrarVisitante=function(){

document
.getElementById("loginTela")
.classList.add("hidden");

};

window.entrarAdmin=function(){

let senha =
document.getElementById("senhaAdmin").value;

if(senha===SENHA){

admin=true;

document
.getElementById("loginTela")
.classList.add("hidden");

document
.getElementById("adminArea")
.classList.remove("hidden");

}else{

alert("Senha incorreta");

}

};

/* add */

window.add=async function(){

if(!admin)return;

let nome =
document.getElementById("nome").value.trim();

let genero =
document.getElementById("genero").value;

let nivel =
parseInt(
document.getElementById("nivel").value
);

if(nome==="") return;

let existe = jogadores.some(j=>
j.nome.toLowerCase()===nome.toLowerCase()
);

if(existe){

alert("Jogador já cadastrado");
return;

}

jogadores.push({
nome,
genero,
nivel
});

await salvar();

document.getElementById("nome").value="";

};

/* remover */

window.removerJogador=async function(nome){

if(!admin)return;

jogadores=jogadores.filter(
j=>j.nome!==nome
);

await salvar();

};

/* RESETAR */

window.resetarSorteio = async function(){

if(!admin)return;

let confirmar = confirm(
"Resetar todos os sorteios?\n\nOs jogadores continuarão cadastrados."
);

if(!confirmar)return;

times = [];
fila = [];

await salvar();

render();

alert("Sorteio resetado com sucesso.");

};

/* soma */

function soma(lista){

if(!Array.isArray(lista)) return 0;

return lista.reduce((a,j)=>{

return a+(Number(j.nivel)||0);

},0);

}

/* sorteio */

function sortear(){

times=[];
fila=[];

let homens = jogadores.filter(
j=>j.genero==="M"
);

let mulheres = jogadores.filter(
j=>j.genero==="F"
);

homens.sort(()=>Math.random()-0.5);
mulheres.sort(()=>Math.random()-0.5);

let qtdTimes = Math.floor(
Math.min(
homens.length/2,
mulheres.length/2
)
);

for(let i=0;i<qtdTimes;i++){

times.push({
numero:i+1,
jogadores:[]
});

}

for(let i=0;i<qtdTimes;i++){

if(homens.length>0)
times[i].jogadores.push(homens.shift());

if(homens.length>0)
times[i].jogadores.push(homens.shift());

if(mulheres.length>0)
times[i].jogadores.push(mulheres.shift());

if(mulheres.length>0)
times[i].jogadores.push(mulheres.shift());

}

fila.push(...homens);
fila.push(...mulheres);

}

/* animação */

window.sortearAnimado=function(){

if(!admin)return;

let tela =
document.getElementById("animacao");

let nomeAnimado =
document.getElementById("nomeAnimado");

tela.classList.remove("hidden");

let i=0;

let intervalo=setInterval(()=>{

if(jogadores.length>0){

nomeAnimado.innerHTML =
jogadores[i % jogadores.length].nome;

i++;

}

},100);

setTimeout(async()=>{

clearInterval(intervalo);

try{

sortear();

await salvar();

render();

}catch(e){

console.error(e);

alert(e.message);

}

tela.classList.add("hidden");

},3000);

};

/* render */

function render(){

/* lista */

let ul =
document.getElementById("lista");

ul.innerHTML="";

jogadores.forEach(j=>{

ul.innerHTML += `

<li>

${j.nome}
(${j.genero} N${j.nivel})

${admin
?
`<button class="removeBtn" onclick="removerJogador('${j.nome}')">❌</button>`
:
""
}

</li>

`;

});

/* ranking */

let ranking =
document.getElementById("ranking");

ranking.innerHTML="";

[...jogadores]
.sort((a,b)=>b.nivel-a.nivel)
.forEach((j,i)=>{

ranking.innerHTML += `

<div class="rankItem">

#${i+1}
-
${j.nome}
(N${j.nivel})

</div>

`;

});

/* times */

let div =
document.getElementById("times");

div.innerHTML="";

times.forEach(timeObj=>{

let t=timeObj.jogadores;

div.innerHTML += `

<div class="time">

<h3>
🏐 TIME ${timeObj.numero}
</h3>

<p>
⭐ Nível Total:
${soma(t)}
</p>

${t.map(j=>`

<div class="player">
${j.nome}
(${j.genero} N${j.nivel})
</div>

`).join("")}

</div>

`;

});

/* fila */

let filaDiv =
document.getElementById("fila");

filaDiv.innerHTML=`
<h2 style="margin-bottom:15px;">
🚨 Fila
</h2>
`;

if(fila.length===0){

filaDiv.innerHTML += `
<p>
Nenhum atleta na fila
</p>
`;

}else{

fila.forEach(j=>{

filaDiv.innerHTML += `
<p>
${j.nome}
(${j.genero} N${j.nivel})
</p>
`;

});

}

/* estatísticas */

let estat =
document.getElementById("estatisticas");

estat.innerHTML = `

<p>
👥 Jogadores:
${jogadores.length}
</p>

<p>
🏐 Times:
${times.length}
</p>

<p>
🚨 Fila:
${fila.length}
</p>

`;

/* tv */

let tv =
document.getElementById("tvConteudo");

tv.innerHTML="";

times.forEach(timeObj=>{

tv.innerHTML += `

<div class="tvTime">

<h2>
TIME ${timeObj.numero}
</h2>

<p>
⭐ ${soma(timeObj.jogadores)}
</p>

<p>
${timeObj.jogadores.map(
j=>j.nome
).join(" • ")}
</p>

</div>

`;

});

grafico();

gerarQR();

}

/* gráfico */

function grafico(){

try{

const canvas =
document.getElementById("grafico");

const ctx =
canvas.getContext("2d");

if(window.graficoObj){

window.graficoObj.destroy();

}

window.graficoObj =
new Chart(ctx,{

type:"bar",

data:{

labels:times.map(
t=>`Time ${t.numero}`
),

datasets:[{

label:"Nível Total",

data:times.map(
t=>soma(t.jogadores)
)

}]

},

options:{

responsive:true,

plugins:{
legend:{
labels:{
color:"white"
}
}
},

scales:{

x:{
ticks:{
color:"white"
}
},

y:{
beginAtZero:true,
ticks:{
color:"white"
}
}

}

}

});

}catch(e){

console.error(e);

}

}

/* exportar */

window.exportarImagem=function(){

html2canvas(
document.getElementById("times")
).then(canvas=>{

let link =
document.createElement("a");

link.download="times.png";

link.href=canvas.toDataURL();

link.click();

});

};

/* tv */

window.abrirTV=function(){

document
.getElementById("tv")
.classList.toggle("hidden");

};

/* qr */

function gerarQR(){

let qrDiv =
document.getElementById("qr");

qrDiv.innerHTML="";

QRCode.toCanvas(
window.location.href,
{
width:220
},
function(error,canvas){

if(error)return;

qrDiv.appendChild(canvas);

});

}

</script>

</body>
</html>
